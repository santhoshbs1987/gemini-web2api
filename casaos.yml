name: gemini-web2api
services:
  gemini-web2api:
    image: ghcr.io/santhoshbs1987/gemini-web2api:latest
    container_name: gemini-web2api
    restart: unless-stopped
    network_mode: host
    volumes:
      - type: bind
        source: /DATA/AppData/gemini-web2api/config.json
        target: /app/config.json
      - type: bind
        source: /DATA/AppData/gemini-web2api/cookie.txt
        target: /app/cookie.txt
    x-casaos:
      volumes:
        - container: /app/config.json
          description:
            en_us: Configuration file (config.json)
        - container: /app/cookie.txt
          description:
            en_us: Optional session cookies for Pro models
x-casaos:
  architectures:
    - arm64
    - amd64
  main: gemini-web2api
  title:
    en_us: Gemini Web2API
  tagline:
    en_us: Google Gemini Web to OpenAI API Proxy
  description:
    en_us: High-performance Go proxy converting Google Gemini's web interface into an OpenAI-compatible API. Native ARM64 & AMD64 support.
  category: AI
  author: santhoshbs1987
  developer: ikhsan3adi
  icon: https://raw.githubusercontent.com/Sophomoresty/gemini-web2api/main/logo.png
  thumbnail: https://raw.githubusercontent.com/Sophomoresty/gemini-web2api/main/logo.png
  port_map: "8081"
  scheme: http
  index: /
